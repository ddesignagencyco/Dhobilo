# Load balancer for two API replicas (BE-9.7). TLS is terminated in front of this (cloud LB / ingress); here it is plain HTTP.
worker_processes auto;
events { worker_connections 4096; }

http {
  # Names are resolved when nginx starts or reloads: after replacing a replica with a new container, run `nginx -s reload`.
  upstream api {
    zone api 64k;
    server api:4000 max_fails=1 fail_timeout=2s;
    server api2:4000 max_fails=1 fail_timeout=2s;
    keepalive 64;
  }

  map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

  server {
    listen 8080;
    client_max_body_size 2m;

    # A replica that is draining answers /health/ready with 503; the next one takes the request.
    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
      proxy_connect_timeout 2s;
      proxy_read_timeout 60s;
    }

    # Live order tracking is a long-lived stream: never buffer it.
    location ~ ^/api/v1/orders/[^/]+/events$ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
    }
  }
}
