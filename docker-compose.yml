name: dhoblio

services:
  postgres:
    image: postgres:16-alpine
    container_name: dhoblio-postgres
    environment:
      POSTGRES_USER: dhoblio
      POSTGRES_PASSWORD: dhoblio
      POSTGRES_DB: dhoblio
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dhoblio"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dhoblio-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog
    container_name: dhoblio-mailhog
    ports: ["1025:1025", "8025:8025"] # SMTP / web UI

  migrate:
    build: { context: ., dockerfile: docker/api.Dockerfile, target: build }
    container_name: dhoblio-migrate
    command: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dhoblio:dhoblio@postgres:5432/dhoblio?schema=public
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    container_name: dhoblio-api
    command: ["node", "dist/main.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dhoblio:dhoblio@postgres:5432/dhoblio?schema=public
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailhog
    ports: ["4000:4000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 6
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      mailhog: { condition: service_started }

  worker:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    container_name: dhoblio-worker
    command: ["node", "dist/worker.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dhoblio:dhoblio@postgres:5432/dhoblio?schema=public
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailhog
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  pgdata: {}
  redisdata: {}
